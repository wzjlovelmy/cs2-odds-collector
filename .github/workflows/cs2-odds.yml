name: cs2-odds

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 采集盘口 | probe = 看 Bovada 结构 | hist = 探测历史让分盘源"
        required: false
        default: "collect"
      only:
        description: "hist 模式的单源过滤（betexplorer/oddsportal/fonbet/bo3/misc）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cs2-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        if: github.event.inputs.mode == 'hist'
        run: pip install --quiet curl_cffi

      - name: Probe historical handicap sources
        if: github.event.inputs.mode == 'hist'
        run: python probe_coverage.py

      - name: Structure probe
        if: github.event.inputs.mode == 'probe'
        run: python probe_bovada2.py

      - name: Collect odds (Bovada + Kambi)
        if: github.event.inputs.mode == 'collect' || github.event.inputs.mode == ''
        run: python fetch_odds.py

      - name: Commit results
        if: always()
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A out
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "[skip ci] odds $(date -u +%Y%m%dT%H%MZ)"
            git push
          fi
